<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.6" stop-color="#08202a"/>
      <stop offset="1" stop-color="#0c3a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <mask id="gap">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M96 326 C160 270 212 356 266 314 C316 276 358 294 420 252" fill="none" stroke="#000" stroke-width="46" stroke-linecap="round"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="240" fill="url(#glow)"/>
  <!-- the A: one ribbon rising and falling -->
  <path d="M148 388 L256 142 L364 388" fill="none" stroke="url(#ribbon)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.55"/>
  <path d="M148 388 L256 142 L364 388" fill="none" stroke="url(#ribbon)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" mask="url(#gap)"/>
  <!-- the crossbar is a wave: the flow -->
  <path d="M96 326 C160 270 212 356 266 314 C316 276 358 294 420 252" fill="none" stroke="url(#wave)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="404" cy="130" r="13" fill="#fb7185"/>
  <circle cx="430" cy="168" r="6" fill="#a7f3d0" opacity="0.8"/>
</svg>
