name: Build apps

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  ios:
    name: iPad (unsigned IPA)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm run build

      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: App icon
        run: npx --yes @capacitor/assets@3 generate --ios --assetPath resources --iconBackgroundColor '#09090d'

      - name: Patch Info.plist
        run: |
          P=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$P" || true; }
          pb "Set :CFBundleDisplayName AniPlayer"
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string audio"
          pb "Add :UIStatusBarStyle string UIStatusBarStyleLightContent"
          pb "Delete :UIViewControllerBasedStatusBarAppearance"
          # YES: lets fullscreen video hide the status bar (and the StatusBar plugin control it)
          pb "Add :UIViewControllerBasedStatusBarAppearance bool true"
          pb "Add :UIRequiresFullScreen bool false"
          pb "Delete :UISupportedInterfaceOrientations~ipad"
          pb "Add :UISupportedInterfaceOrientations~ipad array"
          pb "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait"
          pb "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown"
          pb "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft"
          pb "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight"
          pb "Set :CFBundleShortVersionString $(node -p "require('./package.json').version")"
          pb "Set :CFBundleVersion ${{ github.run_number }}"

      - name: Build unsigned app
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../AniPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AniPlayer-ipa
          path: app/AniPlayer.ipa

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: npx --yes @capacitor/assets@3 generate --android --assetPath resources --iconBackgroundColor '#09090d' --iconBackgroundColorDark '#09090d'

      - name: Version and orientation
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$(node -p "require('./package.json').version")\"/" $G
          # phones and tablets in any orientation; video goes landscape on its own
          sed -i 's/<activity/<activity android:screenOrientation="fullUser"/' android/app/src/main/AndroidManifest.xml

      # with the keystore secrets every build carries the same signature, so a new APK installs over the old one
      - name: Build APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon -q
            echo "$KEYSTORE" | base64 -d > release.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-key-alias aniplayer --ks-pass env:KEYSTORE_PASSWORD --out ../AniPlayer.apk aligned.apk
          else
            ./gradlew assembleDebug --no-daemon -q
            cp app/build/outputs/apk/debug/app-debug.apk ../AniPlayer.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AniPlayer-android
          path: app/AniPlayer.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # every build gets a higher version so installed apps see it as an update
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AniPlayer-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml

  release:
    name: Publish "latest" release
    needs: [ios, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "AniPlayer build ${{ github.run_number }}" \
            --notes "IPA для iPad (ставится через Sideloadly/AltStore), APK для Android и установщик для Windows. Сборка из ${GITHUB_SHA::7}." --latest
