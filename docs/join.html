<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Смотреть вместе в Anyflow</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0d14; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px 20px; text-align: center; }
      h1 { font-size: 26px; margin: 0 0 8px; }
      p { color: #a3a9b8; margin: 0 0 20px; }
      .code { font: 800 34px ui-monospace, monospace; letter-spacing: .3em; margin: 8px 0 24px; }
      a.btn { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #fff; color: #000; font-weight: 800; text-decoration: none; margin: 4px; }
      a.alt { background: #ffffff1a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Вас зовут смотреть вместе</h1>
      <p>Anyflow откроется сразу в комнате друга — с той же серии и секунды.</p>
      <div class="code" id="code"></div>
      <a class="btn" id="open" href="#">Открыть в Anyflow</a>
      <a class="btn alt" href="https://github.com/vanaedynak/AniPlayer/releases/latest">Скачать Anyflow</a>
      <p style="margin-top: 20px; font-size: 13px">Нет приложения? Установите его, войдите в аккаунт и нажмите «Открыть» ещё раз — или введите код в Anyflow: значок 👥 сверху.</p>
    </main>
    <script>
      // only the room code goes on: six letters and digits
      const code = (new URLSearchParams(location.search).get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6)
      document.getElementById('code').textContent = code
      const link = 'anyflow://join/' + code
      document.getElementById('open').href = link
      if (code.length === 6) location.href = link
    </script>
  </body>
</html>
